
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>International Aid Matrix</title>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="matrix.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f6fa;
            color: #222;
        }

        h1 {
            margin: 0 0 10px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        button {
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            border: 1px solid #bbb;
            border-radius: 5px;
            background: white;
        }

        button:hover {
            background: #e8eef8;
        }

        #zoom-level {
            min-width: 55px;
        }

        #status {
            color: #666;
            font-size: 14px;
        }

        #matrix-container {
            width: 100%;
            height: 78vh;
            min-height: 450px;
            overflow: auto;
            border: 1px solid #ccc;
            background: white;
        }

        #matrix {
            display: block;
        }

        .cell {
            cursor: pointer;
        }

        .cell:hover {
            stroke: #f59e0b;
            stroke-width: 2;
        }

        .row-label,
        .column-label {
            fill: #333;
            font-size: 12px;
        }

        .tooltip {
            position: absolute;
            z-index: 1000;
            pointer-events: none;
            background: white;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-shadow: 0 3px 12px #0002;
            font-size: 13px;
            line-height: 1.6;
            opacity: 0;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .gradient {
            width: 220px;
            height: 15px;
            background: linear-gradient(
                to right,
                #eff6ff,
                #93c5fd,
                #1d4ed8,
                #172554
            );
        }

        .hint {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>International Aid Matrix</h1>

    <p>
        Rows represent donors.
        Columns represent recipients.
        Darker cells indicate larger aid transfers.
    </p>

    <div class="toolbar">
        <button id="zoom-in">Zoom +</button>
        <button id="zoom-out">Zoom −</button>
        <button id="zoom-reset">Reset</button>

        <span id="zoom-level">100%</span>
        <span id="status">Loading Aid.csv...</span>
    </div>

    <div id="matrix-container">
        <svg id="matrix"></svg>
    </div>

    <div class="legend">
        <span>Less aid</span>
        <div class="gradient"></div>
        <span>More aid</span>
    </div>

    <p class="hint">
        Scroll to navigate. Use zoom buttons or
        Ctrl + mouse wheel to zoom.
        Hover over a colored cell for details.
    </p>

    <div id="tooltip" class="tooltip"></div>
</body>
</html>
